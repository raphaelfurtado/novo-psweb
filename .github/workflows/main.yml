on: 
    push: 
        branches:
            - main  
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy Server
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: novo-psweb/
          # Protege arquivos que vivem só no servidor (não vêm do repositório):
          # .env de produção, dependências/builds e os anexos enviados.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/vendor/**
            **/public/build/**
            **/public/hot
            public/storage
            **/storage/app/uploads/**
            **/storage/framework/**
            **/storage/logs/**