on:
    push:
        branches:
            - main
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy Server
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⎔ Setup Node
      uses: actions/setup-node@v4
      with:
          node-version: 20

    - name: 📦 Install dependencies & build assets
      run: |
          npm ci
          npm run build

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: novo-psweb/
          # Protege arquivos que vivem só no servidor (não vêm do repositório):
          # .env de produção, dependências e os anexos enviados.
          # OBS: public/build agora É enviado (gerado no passo de build acima).
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/vendor/**
            **/public/hot
            public/storage
            **/storage/app/uploads/**
            **/storage/framework/**
            **/storage/logs/**

    # O document root do domínio (psweb.forcehub.com.br/) tem um index.php "shim"
    # que carrega o Laravel de ../novo-psweb. O PHP lê o manifest de
    # novo-psweb/public/build (sync acima), mas o Apache serve /build/ a partir
    # do docroot. Por isso o build precisa ir TAMBÉM para o docroot.
    - name: 📂 Sync build to docroot
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/build/
          server-dir: psweb.forcehub.com.br/build/
